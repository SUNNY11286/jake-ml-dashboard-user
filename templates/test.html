<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <title>Access Page</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa; /* Light background */
        }
        h2 {
            margin-bottom: 20px;
        }
        .user-info {
            margin-bottom: 20px;
        }
        /* Modal Styles */
        .modal {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 1; /* Sit on top */
            left: 0;
            top: 0;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            overflow: auto; /* Enable scroll if needed */
            background-color: rgba(0,0,0,0.4); /* Black w/ opacity */
            padding-top: 60px;
        }
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto; /* 15% from the top and centered */
            padding: 20px;
            border: 1px solid #888;
            width: 80%; /* Could be more or less, depending on screen size */
            height: 80%; /* Set height */
            position: relative; /* Position relative for loading overlay */
        }
        .modal-content iframe {
            width: 100%;
            height: 100%; /* Take full height of modal */
            border: none;
            display: none; /* Initially hide the iframe */
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            display: none; /* Initially hidden */
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        .logout-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h2>Accessing Full Features</h2>
    
    <div class="user-info">
        <p><strong>User:</strong> {{ session['user'] }}</p>
        <p><strong>Subscription:</strong> {{ session['subscription'] }}</p>
    </div>

    <button onclick="openModal()" class="logout-btn">Open Streamlit App</button>
    
    <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>

    <!-- The Modal -->
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div class="loading" id="loading">Loading...</div>
            <iframe id="iframe" src="https://share.streamlit.io/sunny11286/ml-dashboard-code/MLD.py" onload="hideLoading()"></iframe>
        </div>
    </div>

    <script>
        // Open the modal
        function openModal() {
            document.getElementById("myModal").style.display = "block";
            document.getElementById("loading").style.display = "block"; // Show loading indicator
            document.getElementById("iframe").style.display = "none"; // Hide iframe initially
        }

        // Close the modal
        function closeModal() {
            document.getElementById("myModal").style.display = "none";
        }

        // Hide loading and show iframe
        function hideLoading() {
            document.getElementById("loading").style.display = "none"; // Hide loading indicator
            document.getElementById("iframe").style.display = "block"; // Show iframe
        }

        // Close the modal if user clicks anywhere outside of the modal content
        window.onclick = function(event) {
            const modal = document.getElementById("myModal");
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
