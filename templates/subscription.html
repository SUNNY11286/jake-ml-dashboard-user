<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <title>Subscription</title>
</head>
<body>
    <div class="container">
        <h2>Your Current Subscription: {{ subscription }}</h2>
        <form action="{{ url_for('subscription') }}" method="POST">
            <label for="subscription">Upgrade/Change Subscription:</label>
            <select name="subscription" id="subscription">
                <option value="free">Free Trial</option>
                <option value="pro">Pro - 100 rupees/month</option>
                <option value="premium">Premium - 500 rupees/month</option>
                <option value="on-demand">On Demand</option>
            </select>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
