  <!DOCTYPE html>
  <html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
      <title>Access Page</title>
      <style>
          body {
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: flex-start;
              height: 100vh;
              margin: 0;
              padding: 20px;
              background-color: #f8f9fa; /* Light background */
          }
          h2 {
              margin-bottom: 20px;
          }
          .user-info {
              margin-bottom: 20px;
          }
          .logout-btn {
              margin-top: 20px;
              padding: 10px 20px;
              font-size: 16px;
          }
          .streamlit-btn {
              margin-top: 20px;
              padding: 10px 20px;
              font-size: 16px;
              background-color: #007bff; /* Primary button color */
              color: white;
              border: none;
              border-radius: 5px;
              cursor: pointer;
          }
          .streamlit-btn:hover {
              background-color: #0056b3; /* Darker shade on hover */
          }
      </style>
  </head>
  <body>
      <h2>Accessing Full Features</h2>
      
      <div class="user-info">
          <p><strong>User:</strong> {{ session['user'] }}</p>
          <p><strong>Subscription:</strong> {{ session['subscription'] }}</p>
      </div>
  
      <a href="{{ url_for('streamlit_access') }}" class="streamlit-btn" target="_blank">Open Streamlit App</a>
      
      <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
  </body>
  </html>
